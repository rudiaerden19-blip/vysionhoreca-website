<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vysion kassa — foto's</title>
  <style>
    body { margin: 0; background: #111114; color: #ececec; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: #9a9aa3; font-size: 14px; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { margin: 0; background: #1a1a1e; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 12px; font-size: 13px; color: #c8c8d0; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <main>
    <h1>Vysion kassa — foto's</h1>
    <p>Vijf zichten. Geen 3D-bestand, geen schema — alleen png.</p>
    <div class="grid">
      <figure class="wide">
        <img src="kassa-3d/vysion-kassa-zicht-driekwart.png" alt="Driekwart" />
        <figcaption>Driekwart</figcaption>
      </figure>
      <figure>
        <img src="kassa-3d/vysion-kassa-zicht-voor.png" alt="Voor" />
        <figcaption>Voor — kassier</figcaption>
      </figure>
      <figure>
        <img src="kassa-3d/vysion-kassa-zicht-achter.png" alt="Achter" />
        <figcaption>Achter — klant</figcaption>
      </figure>
      <figure>
        <img src="kassa-3d/vysion-kassa-zicht-links.png" alt="Links" />
        <figcaption>Links</figcaption>
      </figure>
      <figure>
        <img src="kassa-3d/vysion-kassa-zicht-rechts.png" alt="Rechts" />
        <figcaption>Rechts — printer</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
