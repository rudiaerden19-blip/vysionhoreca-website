<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#e8e6e1"/>
  <text x="48" y="44" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222">VYSION KASSA - kassier + klant (rug-aan-rug)</text>
  <text x="48" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">1:5 / mm / groot scherm naar de lade / klein scherm 180 graden naar de klant</text>

  <g transform="translate(80,140)">
    <text x="0" y="-16" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">ZIJ - schermen tegengesteld</text>
    <line x1="0" y1="420" x2="420" y2="420" stroke="#bbb" stroke-width="1"/>
    <rect x="80" y="300" width="260" height="120" fill="#2c2c30" stroke="#111"/>
    <rect x="80" y="300" width="8" height="120" fill="#8a9098"/>
    <rect x="88" y="408" width="120" height="4" fill="#FF6B35"/>
    <rect x="196" y="160" width="28" height="140" fill="#b8bcc4" stroke="#555"/>
    <g transform="rotate(-22 160 210)">
      <rect x="40" y="120" width="22" height="180" fill="#111" stroke="#000"/>
      <rect x="38" y="128" width="6" height="164" fill="#1c1c22"/>
    </g>
    <g transform="rotate(18 260 200)">
      <rect x="248" y="140" width="16" height="120" fill="#111" stroke="#000"/>
      <rect x="260" y="148" width="6" height="104" fill="#3a3a42"/>
    </g>
    <text x="8" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#FF6B35">&lt;- KASSIER</text>
    <text x="300" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#FF6B35">KLANT -&gt;</text>
    <text x="80" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">lade 400 x 340 x 100 / printer in blok</text>
  </g>

  <g transform="translate(560,140)">
    <text x="0" y="-16" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">BOVEN - een voor, een achter</text>
    <rect x="40" y="80" width="400" height="340" fill="#2c2c30" stroke="#111"/>
    <rect x="300" y="100" width="120" height="160" fill="#1a1a1e" stroke="#444"/>
    <text x="312" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">printer</text>
    <rect x="222" y="232" width="36" height="36" fill="#b8bcc4" stroke="#555"/>
    <rect x="87" y="140" width="346" height="28" fill="#111" stroke="#000"/>
    <text x="200" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FF6B35">KASSIER (voor)</text>
    <rect x="150" y="300" width="220" height="16" fill="#111" stroke="#000"/>
    <text x="200" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FF6B35">KLANT (achter)</text>
    <text x="40" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">400 x 340</text>
  </g>

  <g transform="translate(1080,140)">
    <text x="0" y="-16" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">VOOR - kassier ziet groot scherm</text>
    <rect x="20" y="300" width="400" height="100" fill="#2c2c30" stroke="#111"/>
    <rect x="28" y="318" width="230" height="54" fill="#8a9098"/>
    <circle cx="140" cy="345" r="5" fill="#555"/>
    <rect x="28" y="380" width="230" height="4" fill="#FF6B35"/>
    <rect x="280" y="310" width="120" height="70" fill="#1a1a1e" stroke="#444"/>
    <rect x="300" y="318" width="80" height="6" fill="#eee"/>
    <rect x="202" y="160" width="36" height="140" fill="#b8bcc4"/>
    <rect x="47" y="80" width="346" height="220" fill="#111" stroke="#000"/>
    <rect x="59" y="92" width="322" height="196" fill="#1c1c22"/>
    <text x="160" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#888">kassier 346 x 220</text>
    <text x="20" y="430" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">klantenscherm zit achter dit scherm</text>
  </g>

  <g transform="translate(80,560)">
    <text x="0" y="-16" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">ACHTER - klant ziet klein scherm</text>
    <rect x="20" y="160" width="400" height="100" fill="#2c2c30" stroke="#111"/>
    <rect x="202" y="20" width="36" height="140" fill="#b8bcc4"/>
    <rect x="110" y="8" width="220" height="140" fill="#111" stroke="#000"/>
    <rect x="120" y="18" width="200" height="120" fill="#2a2a32"/>
    <text x="168" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FF6B35">TOTAAL</text>
    <text x="20" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">klantenscherm 220 x 140 / rug van Elo erachter</text>
  </g>

  <text x="560" y="820" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Niet twee schermen naast elkaar. Elo-nek: rug-aan-rug, 180 graden.</text>
  <text x="1180" y="860" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">CONCEPT / mm / print max 250x250x250</text>
</svg>
