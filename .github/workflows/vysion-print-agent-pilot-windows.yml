# Pilot-build met cloud print — handmatig workflow_dispatch, GEEN GitHub Release update.
name: Vysion Print Agent — Pilot (cloud print)

on:
  workflow_dispatch:

concurrency:
  group: print-agent-pilot-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/vysion-print-agent/package-lock.json

      - name: npm ci
        working-directory: apps/vysion-print-agent
        run: npm ci

      - name: Inno Setup 6 installeren
        run: choco install innosetup -y --no-progress

      - name: Bouw Inno USB-installer (geen NSIS / geen GitHub Release)
        working-directory: apps/vysion-print-agent
        shell: pwsh
        run: |
          $env:ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $env:ISCC)) {
            $env:ISCC = 'C:\Program Files\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $env:ISCC)) { throw "ISCC.exe niet gevonden na choco install" }
          & .\scripts\build-inno-installer.ps1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verifieer Inno-output
        shell: pwsh
        run: |
          $out = "apps/vysion-print-agent/inno/output/VYSION Print Agent Installeren.exe"
          if (-not (Test-Path -LiteralPath $out)) { throw "Ontbrekend: $out" }
          $h = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash
          Write-Host "SHA256 $out = $h"

      - uses: actions/upload-artifact@v4
        with:
          name: VYSION-Print-Agent-Installeren
          path: apps/vysion-print-agent/inno/output/VYSION Print Agent Installeren.exe
